name: Java Maven CI/CD

# Trigger pipeline on push or pull request
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the source code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) Set up JDK (Java 17 is standard; change version if needed)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 3) Cache local Maven repository to speed up builds
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # 4) Build and test with Maven
      - name: Build with Maven
        run: mvn clean verify -B
      
      # 5) Package the artifact
      - name: Package artifact
        run: mvn package -DskipTests -B

      # 6) Optional: Upload build results (artifacts)
      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar
